<!-- Product Management View -->
<div class="content-grid">
    <!-- Add Product Form inside a Card -->
    <div class="content-card">
        <div class="card-header">Add New Product</div>

        <form class="auth-form" id="add-product-form">
            <div class="input-group">
                <label for="productName">Product Name</label>
                <input type="text" id="productName" placeholder="E.g. Steel Pipe 2in" required>
            </div>
            <div class="input-group">
                <label for="productCategory">Category</label>
                <select id="productCategory" required>
                    <option value="General">General</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Mechanical">Mechanical</option>
                    <option value="Raw Materials">Raw Materials</option>
                    <option value="Tools">Tools</option>
                </select>
            </div>
            <div class="input-group">
                <label for="productQuantity">Quantity in Stock</label>
                <input type="number" id="productQuantity" placeholder="0" value="0" min="0" required>
            </div>
            <div class="input-group">
                <label for="productPrice">Price per Unit (MK)</label>
                <input type="number" step="0.01" id="productPrice" placeholder="0.00" value="0.00" min="0" required>
            </div>
            <button type="button" id="addProductBtn" class="submit-btn" onclick="handleAddProduct()">Add to
                Inventory</button>
            <div id="product-feedback" class="auth-feedback" style="display: none; margin-top: 1rem;"></div>
        </form>
    </div>

    <!-- Inventory Table inside a Card -->
    <div class="content-card">
        <div class="card-header">Current Inventory List</div>

        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Quantity</th>
                        <th>Unit Cost (MK)</th>
                        <th>Unit Price (MK)</th>
                        <th>Total Cost (MK)</th>
                        <th>Estimated Total Revenue (MK)</th>
                    </tr>
                </thead>
                <tbody id="inventoryList">
                    <!-- Populated dynamically by JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>
