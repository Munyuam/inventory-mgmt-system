<div class="settings-grid">
    <div class="content-card">
        <div class="card-header">Profile Management</div>
        <form class="auth-form">
            <div class="input-group">
                <label>Display Name</label>
                <input type="text" value="John Doe">
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" value="john.doe@example.com">
            </div>
            <button type="button" class="submit-btn" onclick="alert('Profile Updated!')">Update Profile</button>
        </form>
    </div>
    <div class="content-card">
        <div class="card-header">Security</div>
        <form class="auth-form">
            <div class="input-group">
                <label>Current Password</label>
                <input type="password" placeholder="••••••••">
            </div>
            <div class="input-group">
                <label>New Password</label>
                <input type="password" placeholder="••••••••">
            </div>
            <button type="button" class="submit-btn bg-error" onclick="alert('Password Changed!')">Change
                Password</button>
        </form>
    </div>
</div>
