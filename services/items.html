<!-- Items Management View -->
<div class="content-grid">
    <!-- Add Item Form inside a Card -->
    <div class="content-card">
        <div class="card-header">Add New Item</div>

        <form class="auth-form" id="add-item-form">
            <div class="input-group">
                <label for="itemName">Item Name</label>
                <input type="text" id="itemName" placeholder="E.g. Steel Pipe 2in" required>
            </div>
            <div class="input-group">
                <label for="itemCategory">Category</label>
                <select id="itemCategory" required>
                    <option value="General">General</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Mechanical">Mechanical</option>
                    <option value="Raw Materials">Raw Materials</option>
                    <option value="Tools">Tools</option>
                </select>
            </div>
            <div class="input-group">
                <label for="itemQuantity">Quantity in Stock</label>
                <input type="number" id="itemQuantity" placeholder="0" value="0" min="0" required>
            </div>
            <div class="input-group">
                <label for="itemPrice">Price per Unit ($)</label>
                <input type="number" step="0.01" id="itemPrice" placeholder="0.00" value="0.00" min="0" required>
            </div>
            <button type="button" id="addItemBtn" class="submit-btn" onclick="handleAddItem()">Add to Inventory</button>
        </form>
    </div>

    <!-- Inventory Table inside a Card -->
    <div class="content-card">
        <div class="card-header">Current Inventory List</div>

        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Item Name</th>
                        <th>Category</th>
                        <th>Quantity</th>
                        <th>Price ($)</th>
                    </tr>
                </thead>
                <tbody id="inventoryList">
                    <!-- Populated dynamically by JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>
